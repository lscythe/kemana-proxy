[package]
name = "kemana-proxy"
version = "0.3.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
prost = "0.14.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
