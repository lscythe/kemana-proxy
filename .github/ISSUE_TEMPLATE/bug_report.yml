name: Bug report
description: Report a reproducible problem
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a new report. Report security vulnerabilities privately as described in the security policy.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reliable reproduction.
      placeholder: |
        1. Run ...
        2. Request ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Linux x86_64, Rust 1.99.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets and personal data before posting.
      render: text
